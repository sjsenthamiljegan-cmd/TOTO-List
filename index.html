<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: rgb(170, 116, 221);
            display: inline;
            height: 200px;
            width: 1000px;
            position: absolute;
            left: 500px;
            top: 100px;
        }
        #taskinput{
            background-color:white;
            color: black;
            border-radius: 10px;
            box-shadow: 5px;
             border: none;
            border-radius: 10px;
            padding: 10px;
        }
        #taskinput:hover{
              background-color: rgb(128, 6, 241);
              padding: 10px;
        }
        ul{
            color: rgb(231, 231, 238);
        }
        li{
            color: black;
            font-size: 24px;
            list-style: none;
        }
        button{
            background-color: rgb(231, 227, 227);
            text-align: center;
            border-radius: 10px;
            box-shadow: 5px;
            margin:15px;
            border: none;
            border-radius: 10px;
            padding: 5px;
        }
        button:hover{
            background-color: rgb(55, 243, 18);
            color: white;
        }

        .del{
            background-color: rgb(231, 227, 227);
            text-align: center;
            border-radius: 10px;
            box-shadow: 5px;
            margin:15px;
             border: none;
            border-radius: 10px;
            padding: 5px;
        }
        .del:hover{
            background-color:red ;
            color:white;
        }
        #add{
            background-color: white;
        }
        #add:hover{
            background-color: rgb(21, 6, 243);
        }
        
    </style>
</head>
<body class="box1">
    <div class="con">
        <input type="text " id="taskinput"  placeholder="Tyep the text">
        <button id="add">Add task</button>
        <ul ></ul>
        <h1></h1>


        </ul>
    </div>
    <script>
        let input=document.getElementById('taskinput')
        let add=document.getElementById('add')
        let message=document.querySelector('h1')
        let count = 1;
        add.addEventListener('click',()=>{
            if(input.value==""){
                message.textContent='please type the task name'
                message.style.color='red'
                return
            }
                let taskDiv=document.querySelector('ul')
                let li=document.createElement("li")
                li.textContent=count + ". " +input.value
                taskDiv.appendChild(li)
                input.value = ''
                count ++


                let del=document.createElement("button")
                 del.textContent="Delete"
                 del.classList.add('del')
                 li.appendChild(del)
                del.addEventListener('click',()=>{
                    li.remove()
                })
                

                
                let com=document.createElement("button")
                 com.textContent="completed"
                 li.appendChild(com)
                com.addEventListener('click',()=>{
                   li.style.textDecoration='line-through'
                })
            }
           
        )
        
    </script>
</body>
</html>
